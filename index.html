<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No network access: the app never talks to any server. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>WSTG Checklist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔐%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('wstg-checklist-v1') || 'null'); t = t && t.settings && t.settings.theme; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-icon" aria-hidden="true">🔐</span>
      <span class="brand-text">WebSec <b>WSTG</b> Checklist</span>
    </a>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" id="themeToggle" type="button" title="Toggle dark / light mode" aria-label="Toggle dark / light mode">
        <svg class="i i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn btn-ghost" id="exportAllBtn" type="button" title="Export all data as JSON">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span class="hide-sm">Export</span>
      </button>
      <button class="btn btn-ghost" id="importBtn" type="button" title="Import JSON backup">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>
        <span class="hide-sm">Import</span>
      </button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="wstg-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
